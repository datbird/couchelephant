# Build the image and publish it to GitHub Container Registry.
#
# Tag a release and this runs:
#
#     git tag v1.0.0 && git push origin v1.0.0
#
# It publishes linux/amd64 and linux/arm64, so the same tag works on a normal
# server and on a Raspberry Pi. The suite has to pass first: an image that
# fails its own tests must never reach anyone's Unraid box.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  # Both registries carry the same image. Docker Hub is where people look
  # first; ghcr.io has no pull limit and needs no second account, so a
  # `docker pull` from a stranger's Unraid box never hits a rate limit.
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Skipped until DOCKERHUB_USERNAME and DOCKERHUB_TOKEN exist, so the
      # workflow works before Docker Hub is set up and picks it up after.
      - name: Log in to Docker Hub
        if: vars.DOCKERHUB_IMAGE != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          # v1.2.3 becomes 1.2.3, 1.2 and 1, plus latest. Somebody pinning
          # :1 gets fixes without a surprise major version.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
